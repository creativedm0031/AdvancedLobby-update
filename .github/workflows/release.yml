name: Release

# Builds the plugin and publishes a GitHub release with the jar
# whenever a version tag (e.g. v2.1) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" target/AdvancedLobby-*.jar \
            --title "AdvancedLobby $TAG" \
            --notes "AdvancedLobby $TAG for Minecraft 1.17 - 26.3 (Spigot / Paper). Original plugin by cyne, updated by CreativeDM. See the README for the changelog."
