<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bbg)"/>
  <circle cx="230" cy="200" r="260" fill="url(#blob1)"/>
  <circle cx="1080" cy="40" r="240" fill="url(#blob2)"/>
  <g transform="translate(80,64) scale(0.53125)">
  <defs>
    <linearGradient id="i_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="i_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="i_left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="i_right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="i_glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="i_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#i_bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#i_glow)"/>

  <!-- isometric block (lobby / spawn) -->
  <g filter="url(#i_shadow)">
    <polygon points="256,92 404,177 256,262 108,177" fill="url(#i_top)"/>
    <polygon points="108,177 256,262 256,432 108,347" fill="url(#i_left)"/>
    <polygon points="404,177 256,262 256,432 404,347" fill="url(#i_right)"/>
  </g>

  <!-- portal / doorway on left face -->
  <polygon points="150,250 214,287 214,380 150,343" fill="#312e81" opacity="0.9"/>
  <polygon points="160,262 204,287 204,368 160,343" fill="#22d3ee" opacity="0.85"/>

  <!-- stylised "A" on right face -->
  <g fill="#ffffff">
    <polygon points="330,240 352,227 382,330 364,341"/>
    <polygon points="330,240 352,227 312,363 294,373"/>
    <polygon points="310,312 362,282 367,299 315,329"/>
  </g>

  <!-- star sparkle -->
  <path d="M256 130 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" fill="#6366f1"/>
</g>
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="400" y="190" font-size="92" font-weight="800" fill="url(#txt)" letter-spacing="-2">AdvancedLobby</text>
    <rect x="402" y="222" width="300" height="46" rx="23" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="2"/>
    <text x="552" y="254" font-size="24" font-weight="700" fill="#e0e7ff" text-anchor="middle" letter-spacing="3">v2.0 · MC 26.3</text>
    <text x="404" y="320" font-size="24" font-weight="500" fill="#a5b4fc">by cyne  ·  updated by CreativeDM</text>
  </g>
</svg>